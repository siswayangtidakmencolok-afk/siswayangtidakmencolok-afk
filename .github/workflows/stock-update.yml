name: 📈 Update Stock Portfolio

on:
  schedule:
    # Every 30 minutes during IDX trading hours (09:00-16:00 WIB = 02:00-09:00 UTC)
    # Mon-Fri only
    - cron: '*/30 2-9 * * 1-5'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-stock:
    runs-on: ubuntu-latest
    name: Fetch IDX Stock Prices & Generate SVG

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: output
          fetch-depth: 0

      - name: Checkout main branch files
        run: |
          git fetch origin feature/readme-stock-portfolio:feature/readme-stock-portfolio || git fetch origin main:main
          git checkout origin/main -- scripts/generate_stock_svg.py || git checkout HEAD -- scripts/generate_stock_svg.py

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance matplotlib pillow requests

      - name: Generate stock SVG
        run: python scripts/generate_stock_svg.py

      - name: Commit and push SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "📈 Auto-update stock portfolio [$(date '+%Y-%m-%d %H:%M WIB')]"
          git push origin output
